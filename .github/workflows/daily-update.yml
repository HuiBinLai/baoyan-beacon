name: Daily notice discovery

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover notice candidates
        env:
          LLM_PROVIDER: zhipu
          LLM_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          LLM_MODEL: glm-4-flash-250414
          LLM_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
        run: |
          ADMISSION_YEARS=$(node -e "const y = new Date().getFullYear(); console.log([y + 1, y].join(','));")
          UNIT_OFFSET=$(node -e "const start = new Date(Date.UTC(new Date().getUTCFullYear(), 0, 0)); const diff = Date.now() - start.getTime(); console.log(Math.floor(diff / 86400000) * 80);")
          node scripts/fetch-notices.mjs
          node scripts/discover-graduate-units.mjs --max-pages 6 --max-results 3 --sleep-ms 250
          node scripts/seed-units-from-notices.mjs
          node scripts/audit-graduate-units.mjs
          node scripts/discover-college-sources.mjs --missing-only --search --limit 80 --sleep-ms 350
          node scripts/harvest-985.mjs --years "$ADMISSION_YEARS" --max-per-query 3 --deep
          node scripts/harvest-985.mjs --graduate-units --missing-only --years "$ADMISSION_YEARS" --max-per-query 1 --unit-limit 80 --unit-offset "$UNIT_OFFSET" --sleep-ms 350
          node scripts/crawl-college-notices.mjs
          node scripts/prune-notices.mjs
          if [ -n "$LLM_API_KEY" ]; then
            node scripts/structure-notices.mjs --only-unstructured --llm --concurrency 1 --llm-retries 3
          else
            node scripts/structure-notices.mjs --only-unstructured --concurrency 4
          fi
          node scripts/normalize-notices.mjs
          node scripts/classify-notices.mjs
          node scripts/build-projects.mjs
          node scripts/audit-coverage.mjs
          node scripts/audit-graduate-units.mjs

      - name: Commit updates
        run: |
          if git diff --quiet -- content/notices.json content/projects.json content/coverage-report.json content/graduate-units.json content/graduate-unit-coverage.json content/college-sources.json; then
            echo "No content changes."
          else
            git config user.name "baoyan-beacon-bot"
            git config user.email "actions@github.com"
            git add content/notices.json content/projects.json content/coverage-report.json content/graduate-units.json content/graduate-unit-coverage.json content/college-sources.json
            git commit -m "chore: discover notice candidates"
            git push
          fi
