name: Daily notice discovery

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover notice candidates
        run: node scripts/fetch-notices.mjs

      - name: Commit updates
        run: |
          if git diff --quiet -- content/notices.json; then
            echo "No content changes."
          else
            git config user.name "baoyan-beacon-bot"
            git config user.email "actions@github.com"
            git add content/notices.json
            git commit -m "chore: discover notice candidates"
            git push
          fi
